name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: App (lint, tipos y tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci

  database:
    name: Base de datos (migraciones y tests de seguridad)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Arrancar Supabase con las migraciones y el seed
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor
      - name: Lint del esquema
        run: supabase db lint --level warning
      - name: Tests pgTAP
        run: supabase test db
